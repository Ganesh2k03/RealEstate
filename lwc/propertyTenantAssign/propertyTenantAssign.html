<template>
    <lightning-card title="Assign Property to Tenant" icon-name="standard:relationship">
        <div class="slds-p-around_medium">
            <template lwc:if={propertyLocked}>
                <p class="slds-m-bottom_small slds-text-body_small">
                    Property is pre-filled from the current record.
                </p>
            </template>
            <template lwc:else>
                <lightning-record-picker
                    label="Property"
                    placeholder="Search Properties..."
                    object-api-name="Property__c"
                    value={propertyId}
                    onchange={handlePropertyChange}
                ></lightning-record-picker>
            </template>

            <template lwc:if={tenantLocked}>
                <p class="slds-m-bottom_small slds-text-body_small">
                    Tenant is pre-filled from the current record.
                </p>
            </template>
            <template lwc:else>
                <lightning-record-picker
                    label="Tenant"
                    placeholder="Search Tenants..."
                    object-api-name="Tenant__c"
                    value={tenantId}
                    onchange={handleTenantChange}
                ></lightning-record-picker>
            </template>

            <div class="slds-m-top_medium slds-grid slds-grid_align-end">
                <lightning-button
                    label="Assign"
                    variant="brand"
                    disabled={disabled}
                    onclick={handleAssign}
                ></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
